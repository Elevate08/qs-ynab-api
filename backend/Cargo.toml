[package]
name = "ynab-cli"
version = "1.1.0"
edition = "2021"
authors = ["Omarchy Community"]
description = "Fast, secure backend helper for the Omarchy YNAB Overview plugin"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
chrono = { version = "0.4", features = ["serde"] }
zeroize = "1.8"
libc = "0.2"
chacha20poly1305 = "0.10"
getrandom = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Deliberately no `panic = "abort"`. Aborting skips every destructor, which
# means the `Zeroizing` wrappers guarding the Personal Access Token never wipe
# it, and SIGABRT is a core-dumping signal - so a panic would be the one path
# that writes the token to disk in the clear. Unwinding runs those wipes and
# lets main.rs report a panicking worker thread as an ordinary failure. See
# hardening.rs for the belt-and-braces side of this.
