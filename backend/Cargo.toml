[package]
name = "ynab-cli"
version = "1.0.0"
edition = "2021"
authors = ["Omarchy Community"]
description = "Fast, secure backend helper for the Omarchy YNAB Overview plugin"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
keyring = { version = "3.6", features = ["linux-native"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
