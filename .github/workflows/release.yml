name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance: lets a user verify the published binary was built by this
  # workflow from this tag, rather than uploaded by hand. The binary receives
  # the user's YNAB Personal Access Token, so where it came from matters.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build Binary & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Full history: the step below asks how this tag relates to main.
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Run backend tests
        run: cargo test --manifest-path backend/Cargo.toml --release

      - name: Build release binary
        run: cargo build --manifest-path backend/Cargo.toml --release

      - name: Copy binary to bin/
        run: |
          mkdir -p bin
          cp backend/target/release/ynab-cli bin/ynab-cli
          chmod +x bin/ynab-cli

      - name: Verify binary
        run: |
          ./bin/ynab-cli --help
          ./bin/ynab-cli --version

      # Advisory only: installs clone main, releases are built from tags, and
      # the two drift when a tag is cut before CI has bundled the same source.
      #
      # This deliberately does not compare the two binaries byte for byte. Two
      # independent builds of identical source rarely produce identical bytes -
      # runner images and toolchains move - so that check would warn on almost
      # every release and be tuned out within a month. What has to hold is a
      # relationship between commits, so that is what is checked: main contains
      # this tag, and the helper main bundles was built from this tag or later.
      - name: Check the tag against what main has bundled
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::warning::${GITHUB_SHA::7} is not on main. Users install by cloning main, so this release would ship code they never receive."
            exit 0
          fi

          if ! git cat-file -e origin/main:bin/ynab-cli 2>/dev/null; then
            echo "::warning::main does not bundle bin/ynab-cli yet; CI adds it on the next backend change"
            exit 0
          fi

          # Compare the source the helper was built from, not commit order.
          # A bundle commit is only rewritten when the binary actually changes,
          # so after a docs- or workflow-only commit the newest bundle sits
          # behind the tag while being built from identical backend source -
          # ancestry would call that stale and be wrong. The backend tree is
          # the thing that decides what the helper does, so compare that.
          bundle_commit="$(git log -1 --format=%H origin/main -- bin/ynab-cli)"
          bundle_src="$(git log -1 --format=%s "$bundle_commit" \
            | sed -n 's/^ci: bundle ynab-cli from \([0-9a-f]\{7,40\}\).*/\1/p')"

          if [ -z "$bundle_src" ]; then
            echo "::warning::could not read the source commit out of ${bundle_commit::7}; skipping the staleness check"
            exit 0
          fi

          if [ "$(git rev-parse "$GITHUB_SHA:backend")" = "$(git rev-parse "$bundle_src:backend")" ]; then
            echo "main's bundled helper was built from backend source identical to this tag's"
          else
            echo "::warning::main's bundled helper was built from ${bundle_src::7}, whose backend source differs from this tag's. Installs would run a helper that does not match this release - let CI re-bundle main before announcing it."
          fi

      # No plugin archive is published. The supported install is
      # `omarchy plugin add <repo url>`, which clones main - an archive would
      # be a second, unversioned way to get the plugin that nothing in the
      # docs points at and that silently stops receiving updates. A release
      # exists to give the helper binary a checksum and an attestation, which
      # is what README.md and SECURITY.md actually send people to.
      - name: Generate checksum
        run: |
          set -euo pipefail
          sha256sum bin/ynab-cli > SHA256SUMS
          cat SHA256SUMS

      # Blocking, to match ci.yml. SECURITY.md points users at
      # `gh attestation verify` as the answer to "was this binary really built
      # here?"; a release published without one turns that instruction into a
      # report of unverifiable bytes, which is worse than no release at all.
      # Needs the repository to be public (or to have GHAS enabled).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: bin/ynab-cli

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ynab-cli-x86_64-linux
          path: bin/ynab-cli

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/ynab-cli
            SHA256SUMS
          generate_release_notes: true
